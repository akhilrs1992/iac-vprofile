name: "Vprofile IAC"

on:
  push:
    branches:
      - main
      - stage
    paths:
      - terraform/**
  pull_request:
    branches:
      - main
    paths:
      - terraform/**

env:
  # Non-secret defaults
  AWS_REGION: us-east-2
  EKS_CLUSTER: vprofile-eks

jobs:
  terraform:
    name: "Terraform Provision & EKS Setup"
    runs-on: ubuntu-latest

    env:
      # Credentials for deployment to AWS (scoped to the job to ensure secrets context is available)
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY}}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # S3 bucket for the Terraform state
      BUCKET_TF_STATE: ${{ secrets.BUCKET_TF_STATE }}

    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.3

      - name: Terraform Init
        id: init
        run: terraform init -backend-config="bucket=${{ env.BUCKET_TF_STATE }}"

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false -out=planfile
        continue-on-error: true

      - name: Check Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      # Apply only on main or stage branch
      - name: Terraform Apply
        id: apply
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage') && steps.plan.outcome == 'success'
        run: terraform apply -auto-approve -input=false -parallelism=1 planfile

      - name: Get Kubeconfig for EKS
        id: getconfig
        if: steps.apply.outcome == 'success'
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}

      - name: Install Ingress Controller
        if: steps.apply.outcome == 'success' && steps.getconfig.outcome == 'success'
        run: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.1.3/deploy/static/provider/aws/deploy.yaml

      - name: Validate EKS Cluster Status
        if: steps.getconfig.outcome == 'success'
        run: |
          echo "🔍 Checking EKS Cluster Status..."
          kubectl get nodes -o wide
          echo "---------------------------------------"
          echo "🔍 Checking Ingress Controller Pods..."
          kubectl get pods -n ingress-nginx

      - name: Summarize Deployment
        if: always()
        run: |
          echo "### ✅ EKS Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Cluster: vprofile-eks" >> $GITHUB_STEP_SUMMARY
          echo "- Region: $AWS_REGION" >> $GITHUB_STEP_SUMMARY
          echo "- Kubernetes Version: 1.29" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${GITHUB_REF##*/}" >> $GITHUB_STEP_SUMMARY
          echo "- Ingress Controller: Installed ✅" >> $GITHUB_STEP_SUMMARY
